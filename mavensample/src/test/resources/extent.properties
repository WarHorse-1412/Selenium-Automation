# Enable Spark Report and define output path
extent.reporter.spark.start=true
extent.reporter.spark.out=test-output/SparkReport/Spark.html

# Optional: Enable System Information
systeminfo.os=Windows 11
systeminfo.environment=QA-Sandbox
systeminfo.user=AutomationTester

# Optional: Base64 images for easier sharing (screenshots embedded in HTML)
extent.reporter.spark.base64imagesrc=true